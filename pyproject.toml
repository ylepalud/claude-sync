[project]
name = "claude-sync"
version = "0.1.0"
description = "Isolate and switch between several Claude Code user profiles"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
claude-sync = "claude_sync.cli:entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_sync"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-include = ["scripts/check-denylist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
